services:
  nginx:
    image: nginx
    ports:
      - "3000:80"
    volumes:
      # bind mounting the nginx file in the local machine to container's nginx file
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  redis:
    image: redis
    ports:
      - "6379:6379"

  # all the containers can run on the same because the are isolated from eachother
  # but for the local machine they can't run at the same port because evem though the servers are different but the local machine is same
  # so we have to map different ports for each of them e.g.- 3000, 3001, 3002 ... 
  
  server1:
    build: ./server
    
    env_file:
      - ./server/.env
    
    environment:
      - SERVER_NAME="phela_server"
    
    ports:
      - 3001:3000
  server2:
    build: ./server
    
    env_file:
      - ./server/.env
    
    environment:
      - SERVER_NAME="dusra_server"

    ports:
      - 3002:3000
  server3:
    build: ./server
    
    env_file:
      - ./server/.env
    
    environment:
      - SERVER_NAME="teersa_server"
    
    ports:
      - 3003:3000
